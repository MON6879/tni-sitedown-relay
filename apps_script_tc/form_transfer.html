<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><base target="_top">
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',sans-serif; }
  body { background:#F5F5F5; padding:16px; font-size:14px; }
  h2 { color:#1A237E; margin-bottom:16px; font-size:16px;
       border-bottom:2px solid #1A237E; padding-bottom:8px; }
  .form-group { margin-bottom:12px; }
  label { display:block; font-weight:600; color:#333; margin-bottom:4px; }
  input, select, textarea {
    width:100%; padding:8px 10px; border:1px solid #BDBDBD;
    border-radius:6px; font-size:14px; color:#212121; transition:border 0.2s;
  }
  input:focus, select:focus { outline:none; border-color:#1A237E; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .required { color:#D32F2F; }
  .section-label {
    background:#E8EAF6; padding:6px 10px; border-radius:4px;
    font-weight:700; color:#1A237E; margin:14px 0 8px;
  }
  .pending-list { max-height:200px; overflow-y:auto; border:1px solid #C5CAE9;
                  border-radius:6px; margin-bottom:12px; }
  .pending-item {
    padding:10px 12px; border-bottom:1px solid #E8EAF6; cursor:pointer;
    transition:background 0.15s;
  }
  .pending-item:hover { background:#E8EAF6; }
  .pending-item.selected { background:#C5CAE9; }
  .pending-item .item-title { font-weight:700; color:#1A237E; }
  .pending-item .item-sub { font-size:12px; color:#555; margin-top:2px; }
  .overLimit { border-left:3px solid #D32F2F; }
  .info-box {
    background:#fff; border:1px solid #C5CAE9; border-radius:8px;
    padding:12px; margin:8px 0; display:none;
  }
  .info-row { display:flex; justify-content:space-between; padding:3px 0; font-size:13px; }
  .info-val { font-weight:700; }
  .btn-row { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
  button { padding:9px 24px; border:none; border-radius:6px;
           font-size:14px; font-weight:600; cursor:pointer; }
  .btn-primary { background:#1A237E; color:#fff; }
  .btn-primary:hover { background:#0D1A6E; }
  .btn-cancel { background:#E0E0E0; color:#333; }
  .msg { padding:10px; border-radius:6px; margin-bottom:12px;
         font-weight:600; display:none; }
  .msg.error { background:#FFEBEE; color:#C62828; display:block; }
  .msg.success { background:#E8F5E9; color:#2E7D32; display:block; }
  .empty { padding:16px; text-align:center; color:#999; }
</style>
</head>
<body>
<h2>💳 Xác nhận Chuyển tiền Tạm ứng</h2>
<div id="msg" class="msg"></div>

<div class="section-label">Chọn lệnh tạm ứng cần xử lý</div>
<div id="pendingList" class="pending-list">
  <div class="empty">⏳ Đang tải danh sách...</div>
</div>

<div id="infoBox" class="info-box">
  <div class="info-row"><span>Mã lệnh:</span><span class="info-val" id="iStt">—</span></div>
  <div class="info-row"><span>Team:</span><span class="info-val" id="iTeam">—</span></div>
  <div class="info-row"><span>Đội trưởng:</span><span class="info-val" id="iLeader">—</span></div>
  <div class="info-row"><span>Số tiền đề xuất:</span><span class="info-val" id="iAmount">—</span></div>
  <div class="info-row"><span>Hạn mức còn lại:</span><span class="info-val" id="iLimit">—</span></div>
  <div class="info-row"><span>Lý do:</span><span class="info-val" id="iReason">—</span></div>
</div>

<div class="section-label">Thông tin chuyển tiền</div>
<div class="row2">
  <div class="form-group">
    <label>Ngày chuyển tiền <span class="required">*</span></label>
    <input type="date" id="ngayChuyen" required>
  </div>
  <div class="form-group">
    <label>Phương thức</label>
    <select id="phuongThuc">
      <option value="Normal">Normal</option>
      <option value="Kpay">Kpay</option>
      <option value="Special">Special</option>
    </select>
  </div>
</div>
<div class="row2">
  <div class="form-group">
    <label>Số tiền thực chuyển (đ) <span class="required">*</span></label>
    <input type="number" id="soTienThuc" placeholder="0" min="0" required>
  </div>
  <div class="form-group">
    <label>Mã GD / Reference</label>
    <input type="text" id="ref" placeholder="Số tham chiếu giao dịch">
  </div>
</div>
<div class="form-group">
  <label>Ghi chú BOD</label>
  <textarea id="ghiChu" rows="2" placeholder="Ghi chú thêm nếu có..."></textarea>
</div>

<div class="btn-row">
  <button class="btn-cancel" onclick="google.script.host.close()">Hủy</button>
  <button class="btn-primary" id="btnSubmit" onclick="submitForm()" disabled>
    ✅ Xác nhận Chuyển tiền
  </button>
</div>

<script>
let selectedItem = null;
document.getElementById('ngayChuyen').valueAsDate = new Date();

// Load danh sách lệnh chờ
google.script.run.withSuccessHandler(function(list) {
  const container = document.getElementById('pendingList');
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="empty">✅ Không có lệnh nào đang chờ xử lý</div>';
    return;
  }
  container.innerHTML = '';
  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'pending-item' + (item.vuotHanMuc && item.vuotHanMuc.includes('Vượt') ? ' overLimit' : '');
    div.innerHTML = `
      <div class="item-title">${item.stt} — ${item.team} | ${fmt(item.soTien)} đ</div>
      <div class="item-sub">${item.doiTruong} | ${item.ngay} | ${item.vuotHanMuc}</div>
    `;
    div.onclick = () => selectItem(item, div);
    container.appendChild(div);
  });
}).getPendingAdvances();

function selectItem(item, el) {
  document.querySelectorAll('.pending-item').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  selectedItem = item;

  document.getElementById('iStt').textContent    = item.stt;
  document.getElementById('iTeam').textContent   = item.team;
  document.getElementById('iLeader').textContent = item.doiTruong;
  document.getElementById('iAmount').textContent = fmt(item.soTien) + ' đ';
  document.getElementById('iLimit').textContent  = fmt(item.hanMuc) + ' đ';
  document.getElementById('iReason').textContent = item.lyDo || '—';
  document.getElementById('soTienThuc').value    = item.soTien;
  document.getElementById('infoBox').style.display = 'block';
  document.getElementById('btnSubmit').disabled  = false;
}

function submitForm() {
  if (!selectedItem) { showMsg('error','⚠️ Vui lòng chọn lệnh tạm ứng'); return; }

  const data = {
    row             : selectedItem.row,
    ngayChuyenTien  : document.getElementById('ngayChuyen').value,
    soTienThucChuyen: document.getElementById('soTienThuc').value,
    phuongThuc      : document.getElementById('phuongThuc').value,
    ref             : document.getElementById('ref').value.trim(),
    ghiChu          : document.getElementById('ghiChu').value.trim(),
  };

  if (!data.ngayChuyenTien || !data.soTienThucChuyen) {
    showMsg('error','⚠️ Vui lòng điền đầy đủ ngày và số tiền'); return;
  }

  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnSubmit').textContent = '⏳ Đang xử lý...';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        showMsg('success','✅ Đã xác nhận chuyển tiền! TPTC đã nhận thông báo Telegram.');
        setTimeout(() => google.script.host.close(), 2000);
      } else {
        showMsg('error','❌ Lỗi: ' + result.error);
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').textContent = '✅ Xác nhận Chuyển tiền';
      }
    })
    .saveBodTransfer(data);
}

function fmt(n) { return Number(n||0).toLocaleString('vi-VN'); }
function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + type; el.textContent = text;
}
</script>
</body>
</html>
