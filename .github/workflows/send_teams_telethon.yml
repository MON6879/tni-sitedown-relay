name: Send Teams via Telethon (Personal Account)

on:
  schedule:
    - cron: "*/5 * * * *"   # Mỗi 5 phút
  workflow_dispatch:         # Chạy tay để test

jobs:
  send-teams:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install telethon

      - name: Send Tin1 + Tin2 via personal account
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
          APPS_SCRIPT_URL:   ${{ secrets.APPS_SCRIPT_URL }}
        run: python send_teams_telethon.py

      - name: Save state to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_sd.json || true
          git diff --staged --quiet || git commit -m "state: update last_sd [skip ci]"
          git push || true
