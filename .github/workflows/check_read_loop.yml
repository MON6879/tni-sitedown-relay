name: Check Read Status (Live - Edit mỗi 5 phút)

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Chạy bao lâu (giờ)? Mặc định = 2"
        required: false
        default: "2"

jobs:
  read-status-live:
    runs-on: ubuntu-latest
    timeout-minutes: 130   # tối đa 2 giờ 10 phút

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install telethon

      - name: Live Read Status Monitor
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
          DURATION_HOURS:    ${{ github.event.inputs.duration_hours || '2' }}
        run: python check_read_loop.py
