name: Daily Note Read Report (20:30 Myanmar)

# 20:30 Myanmar (UTC+6:30) = 14:00 UTC — check who read Note by 20:00
on:
  workflow_dispatch:          # Triggered from GAS at 20:30 Myanmar

jobs:
  read-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # Kết nối + 5 groups × ~1 phút = ~7 phút

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install telethon pandas requests

      - name: Run Daily Read Report
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
        run: python daily_read_report.py
