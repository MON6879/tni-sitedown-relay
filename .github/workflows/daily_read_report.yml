name: Daily Read Report (18:00 Myanmar)

# 18:00 Myanmar (UTC+6:30) = 11:30 UTC — runs 30min after cron_send
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:          # Manual trigger for testing

jobs:
  read-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # Kết nối + 5 groups × ~1 phút = ~7 phút

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install telethon

      - name: Run Daily Read Report
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
        run: python daily_read_report.py
