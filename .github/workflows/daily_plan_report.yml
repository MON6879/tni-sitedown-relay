name: Daily Plan Report (21:00 Myanmar)

on:
  schedule:
    - cron: '30 14 * * *'  # 14:30 UTC = 21:00 Myanmar
  workflow_dispatch:       # Manual trigger

jobs:
  daily-plan-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon python-telegram-bot requests pandas

      - name: Run Daily Plan Report
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_plan_report.py
