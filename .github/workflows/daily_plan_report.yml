name: Daily Plan Report (Report 5.1)

on:
  schedule:
    - cron: '18 23 * * *'  # 05:48 AM Myanmar Time (UTC+6:30) -> 23:18 UTC
    - cron: '18 9 * * *'   # 15:48 PM Myanmar Time (UTC+6:30) -> 09:18 UTC
  repository_dispatch:
    types: [run_daily_report, run_daily_plan_report]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: morning | eod | update'
        required: false
        default: 'morning'

jobs:
  plan-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily_plan_report.py (Online 100%)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          REPORT_TASK_BOT_TOKEN: ${{ secrets.REPORT_TASK_BOT_TOKEN }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python daily_plan_report.py
