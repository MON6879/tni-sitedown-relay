name: Daily BOD Assign Report (17:00 Myanmar)

on:
  # Trigger từ GAS lúc 17:00 Myanmar chính xác
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-telegram-bot requests pandas python-dotenv

      - name: Run Daily BOD Assign Report
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_bod_assign.py
