name: 🔄 1. Master Keepalive 24/7 (All Bots)  # last-updated: 2026-08-03

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes 24/7 (100% Free on Public Repo)
  workflow_dispatch:

jobs:
  ping_all:
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Keepalive Ping All Bot Endpoints & Webhooks
        run: |
          echo "1️⃣ Pinging Search Bot 1 (tni-bot)..."
          curl -s -f "https://tni-bot.vercel.app/api/search_bot?action=reset" || true
          
          echo "2️⃣ Pinging Search Bot 2 (tni-done)..."
          curl -s -f "https://tni-done.vercel.app/api/search_bot?action=reset" || true
          
          echo "3️⃣ Pinging Asset Bot (collector)..."
          curl -s -f "https://tni-bot.vercel.app/api/collector?action=reset" || true
          
          echo "4️⃣ Pinging Site Down Bot (tni-sitedown)..."
          curl -s -f "https://tni-sitedown.vercel.app/api/site_down_relay" || true
          curl -s -f "https://api.telegram.org/bot8647102342:AAGwI95-xeyFfJZusOOrIPVBER-z6taZHZI/setWebhook?url=https://tni-sitedown.vercel.app/api/site_down_relay" || true
          
          echo "5️⃣ Pinging Apps Script Backend..."
          curl -s -L "https://script.google.com/macros/s/AKfycbwHyzulEMVGjslfjN_m38HzpFZHRfk2qwbQmdwb6MMqBM8xNm20JJxxzW_4zTNzp3n24Q/exec?action=ping" || true
          
          echo "✅ All bot keepalive pings completed successfully!"
