name: Keepalive Search & Asset Bot  # last-updated: 2026-08-03

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes 24/7 (100% Free on Public Repo)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Search & Asset Bot Vercel Webhook Endpoints
        run: |
          echo "Pinging tni-bot.vercel.app (search_bot)..."
          curl -s -f "https://tni-bot.vercel.app/api/search_bot?action=reset" || true
          echo "Pinging tni-done.vercel.app (search_bot)..."
          curl -s -f "https://tni-done.vercel.app/api/search_bot?action=reset" || true
          echo "Pinging tni-bot.vercel.app (collector asset_bot)..."
          curl -s -f "https://tni-bot.vercel.app/api/collector?action=reset" || true
