name: Construction Bot Keep-Alive (5 Mins)

on:
  schedule:
    - cron: '*/5 * * * *'  # Trigger every 5 minutes to prevent bot cold starts
  workflow_dispatch:

jobs:
  keepalive-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Construction Bot Google Apps Script Web App
        run: |
          curl -s -L "https://script.google.com/macros/s/AKfycbHraNPzUGVRNGvy-7_q4NyTiJSRUvlodCIjiJZJ00PaNMen-MpVjb4YTmyVex00mn6xQ/exec" > /dev/null
          echo "✅ Construction Bot Keep-Alive pinged successfully at $(date)!"
