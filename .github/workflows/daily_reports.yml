name: Unified Daily Reports  # last-updated: 2026-07-23

on:
  schedule:
    - cron: '30 9 * * *'   # 16:00 Myanmar / 09:30 UTC → daily_task + plan_eod + bod_assign + cable_report
    - cron: '0 22 * * *'   # 04:30 Myanmar / 22:00 UTC → 5.1
    - cron: '30 22 * * *'  # 05:00 Myanmar / 22:30 UTC → refuel_report + 5.1
    - cron: '0 23 * * *'   # 05:30 Myanmar / 23:00 UTC → 5.1
    - cron: '30 23 * * *'  # 06:00 Myanmar / 23:30 UTC → 5.1
    - cron: '0 0 * * *'    # 06:30 Myanmar / 00:00 UTC → 5.1
    - cron: '30 6 * * *'   # 13:00 Myanmar / 06:30 UTC → refuel_report
    - cron: '30 0 * * *'   # 07:00 Myanmar / 00:30 UTC → 5.1 + refuel_plan_report
    - cron: '0 1 * * *'    # 07:30 Myanmar / 01:00 UTC → 5.1
    - cron: '30 1 * * *'   # 08:00 Myanmar / 01:30 UTC → 5.1
    - cron: '0 2 * * *'    # 08:30 Myanmar / 02:00 UTC → 5.1
    - cron: '30 3 * * *'   # 10:00 Myanmar / 03:30 UTC → 5.1
    - cron: '30 14 * * *'  # 21:00 Myanmar / 14:30 UTC → plan_update
    - cron: '30 7 * * *'   # 14:00 Myanmar / 07:30 UTC → read_report
    - cron: '0 14 * * *'   # 20:30 Myanmar / 14:00 UTC → read_report
    - cron: '45 10 * * *'  # 17:15 Myanmar / 10:45 UTC → read_report
    - cron: '30 12 * * *'  # 19:00 Myanmar / 12:30 UTC → read_report
    - cron: '30 11 * * *'  # 18:00 Myanmar / 11:30 UTC → refuel_plan_report
    - cron: '30 15 * * *'  # 22:00 Myanmar / 15:30 UTC → 5.1 + refuel_plan_report
    - cron: '30 2 * * *'   # 09:00 Myanmar / 02:30 UTC → 5.1 + refuel_plan_report
    - cron: '0 3 * * *'    # 09:30 Myanmar / 03:00 UTC → 5.1
    - cron: '30 13 * * *'  # 20:00 Myanmar / 13:30 UTC → 5.1 + refuel_plan_report
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Select the report/task to run'
        required: true
        type: choice
        options:
          - 'Reports 1, 2, 3, 4 - Daily Task & Backlog'
          - 'Report 2 (BOD) - BOD Assign'
          - 'Report 5A - Plan EOD'
          - 'Report 5B - Plan Update'
          - 'Report 5C - Plan Morning'
          - 'Report 6 - Daily Note Read Report'
          - 'Task - Cable Daily Report'
          - 'Task - All Refuel Reports'
          - 'Task - Refuel Request Report'
          - 'Task - Refuel Plan Report 1'
          - 'Task - Refuel Plan Report 2'
          - 'Task - Refuel Plan Report 2.1 - FT Monitor Days'
          - 'Task - Refuel Plan Report 4'
          - 'Task - Check Read Status'
          - 'Task - Bot Lookup Relay'
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no) - for botlookup_relay'
        required: false
        default: '1'

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'telethon-manual' || 'telethon-session' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot requests pandas python-dotenv telethon openpyxl

      - name: Report 2 — BOD-assigned Tasks Stats
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '30 9 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'Report 2 (BOD) - BOD Assign')
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_bod_assign.py

      - name: Reports 1, 2, 3, 4 — Daily Backlog & Task Reminders
        if: |
          (github.event_name == 'schedule' && (
            github.event.schedule == '30 9 * * *' ||
            github.event.schedule == '30 0 * * *'
          )) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'Reports 1, 2, 3, 4 - Daily Task & Backlog')
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          REPORT_TASK_BOT_TOKEN: ${{ secrets.REPORT_TASK_BOT_TOKEN }}
          TECHNICAL_DEP_BOT_TOKEN: ${{ secrets.TECHNICAL_DEP_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python backlog_send.py --now
          python cron_send.py

      # Report 5 (no-mode) removed — dùng 5A/5B/5C riêng biệt thay thế

      - name: Report 5A — Daily Plan EOD
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '30 9 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'Report 5A - Plan EOD')
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_plan_report.py --mode eod

      - name: Report 5B — Daily Plan Update
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '30 14 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'Report 5B - Plan Update')
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_plan_report.py --mode update

      - name: Report 5C — Morning Plan (5.1) — 04:30,05:00,05:30,06:00,06:30,07:00,07:30,08:00,08:30,09:00,09:30,10:00,17:20,20:00,22:00 Myanmar
        if: |
          (github.event_name == 'schedule' && (
            github.event.schedule == '0 22 * * *'  ||
            github.event.schedule == '30 22 * * *' ||
            github.event.schedule == '0 23 * * *'  ||
            github.event.schedule == '30 23 * * *' ||
            github.event.schedule == '0 0 * * *'   ||
            github.event.schedule == '30 0 * * *'  ||
            github.event.schedule == '0 1 * * *'   ||
            github.event.schedule == '30 1 * * *'  ||
            github.event.schedule == '0 2 * * *'   ||
            github.event.schedule == '30 2 * * *'  ||
            github.event.schedule == '0 3 * * *'   ||
            github.event.schedule == '30 3 * * *'  ||
            github.event.schedule == '45 10 * * *' ||
            github.event.schedule == '30 13 * * *' ||
            github.event.schedule == '30 15 * * *'
          )) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'Report 5C - Plan Morning')
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_plan_report.py --mode morning

      - name: Report 6 — Daily Note Read Report
        if: |
          (github.event_name == 'schedule' && (
            github.event.schedule == '0 14 * * *'  ||
            github.event.schedule == '30 3 * * *'  ||
            github.event.schedule == '30 7 * * *'  ||
            github.event.schedule == '45 10 * * *' ||
            github.event.schedule == '30 12 * * *'
          )) ||
          (github.event_name == 'workflow_dispatch' && (
            github.event.inputs.report_type == 'Report 6 - Daily Note Read Report'
          ))
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_read_report.py

      - name: Task — Check Read Status
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'Task - Check Read Status'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python check_read_status.py

      - name: Task — Bot Lookup Relay
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'Task - Bot Lookup Relay'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SD_APPS_SCRIPT_URL: ${{ secrets.SD_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          SKIP_DELAY: ${{ github.event.inputs.skip_delay || '1' }}
        run: python botlookup_relay.py


      - name: Task — Cable Daily Report (Cron or Manual)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '30 9 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'Task - Cable Daily Report')
        env:
          COLLECTOR_BOT_TOKEN: ${{ secrets.COLLECTOR_BOT_TOKEN }}
          CABLE_APPS_SCRIPT_URL: ${{ secrets.CABLE_APPS_SCRIPT_URL }}
          CABLE_CHAT_ID: ${{ secrets.CABLE_CHAT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python cable_report.py

      - name: Task — Refuel Request Report (Cron or Manual)
        if: |
          (github.event_name == 'schedule' && (github.event.schedule == '30 9 * * *' || github.event.schedule == '30 6 * * *')) ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.report_type == 'Task - All Refuel Reports' || github.event.inputs.report_type == 'Task - Refuel Request Report'))
        env:
          REFUEL_BOT_TOKEN: ${{ secrets.REFUEL_BOT_TOKEN }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python refuel_send.py

      - name: Task — Refuel Plan Report 1 (07:00, 09:00, 13:00, 16:00, 20:00, 22:00 Myanmar)
        if: |
          (github.event_name == 'schedule' && (
            github.event.schedule == '30 0 * * *' ||
            github.event.schedule == '30 2 * * *' ||
            github.event.schedule == '30 6 * * *' ||
            github.event.schedule == '30 9 * * *' ||
            github.event.schedule == '30 13 * * *' ||
            github.event.schedule == '30 15 * * *'
          )) ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.report_type == 'Task - All Refuel Reports' || github.event.inputs.report_type == 'Task - Refuel Plan Report 1'))
        env:
          REFUEL_BOT_TOKEN: ${{ secrets.REFUEL_BOT_TOKEN }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python refuel_plan_report.py --report 1

      - name: Task — Refuel Plan Report 2 (07:00, 09:00, 13:00, 18:00, 20:00, 22:00 Myanmar)
        if: |
          (github.event_name == 'schedule' && (
            github.event.schedule == '30 0 * * *' ||
            github.event.schedule == '30 2 * * *' ||
            github.event.schedule == '30 6 * * *' ||
            github.event.schedule == '30 11 * * *' ||
            github.event.schedule == '30 13 * * *' ||
            github.event.schedule == '30 15 * * *'
          )) ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.report_type == 'Task - All Refuel Reports' || github.event.inputs.report_type == 'Task - Refuel Plan Report 2'))
        env:
          REFUEL_BOT_TOKEN: ${{ secrets.REFUEL_BOT_TOKEN }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python refuel_plan_report.py --report 2

      - name: Task — Refuel Plan Report 2.1 FT Monitor Days (cùng giờ Report 2)
        if: |
          (github.event_name == 'schedule' && (
            github.event.schedule == '30 0 * * *' ||
            github.event.schedule == '30 2 * * *' ||
            github.event.schedule == '30 6 * * *' ||
            github.event.schedule == '30 11 * * *' ||
            github.event.schedule == '30 13 * * *' ||
            github.event.schedule == '30 15 * * *'
          )) ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.report_type == 'Task - All Refuel Reports' || github.event.inputs.report_type == 'Task - Refuel Plan Report 2.1 - FT Monitor Days'))
        env:
          REFUEL_BOT_TOKEN: ${{ secrets.REFUEL_BOT_TOKEN }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python refuel_plan_report.py --report 21

      - name: Task — Refuel Plan Report 4 (22:00 Myanmar)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '30 15 * * *') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.report_type == 'Task - All Refuel Reports' || github.event.inputs.report_type == 'Task - Refuel Plan Report 4'))
        env:
          REFUEL_BOT_TOKEN: ${{ secrets.REFUEL_BOT_TOKEN }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python refuel_plan_report.py --report 4

        # ✅ Duplicate "Refuel Plan Report (Manual Dispatch)" step đã bị xóa — tránh double-send
