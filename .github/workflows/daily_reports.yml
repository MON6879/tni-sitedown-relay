name: Unified Daily Reports

on:
  schedule:
    - cron: '30 10 * * *'  # 17:00 Myanmar / 10:30 UTC → daily_task (cron_send.py)
    - cron: '0 11 * * *'   # 17:30 Myanmar / 11:00 UTC → cable_report
    - cron: '30 22 * * *'  # 05:00 Myanmar / 22:30 UTC → refuel_report
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Select the report/task to run'
        required: true
        type: choice
        options:
          - bod_assign
          - daily_task
          - plan_report
          - plan_eod
          - plan_update
          - plan_morning
          - read_report
          - check_read_status
          - botlookup_relay
          - cable_report
          - refuel_report
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no) - for botlookup_relay'
        required: false
        default: '1'

concurrency:
  group: telethon-session
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-telegram-bot requests pandas python-dotenv telethon

      - name: Report 2 — BOD-assigned Tasks Stats
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'bod_assign'
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_bod_assign.py

      - name: Reports 1, 2, 3, 4 — Daily Backlog & Task Reminders
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '30 10 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'daily_task')
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          REPORT_TASK_BOT_TOKEN: ${{ secrets.REPORT_TASK_BOT_TOKEN }}
          TECHNICAL_DEP_BOT_TOKEN: ${{ secrets.TECHNICAL_DEP_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python backlog_send.py --now
          python cron_send.py

      - name: Report 5 — Daily Plan & Results
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'plan_report'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_plan_report.py

      - name: Report 5A — Daily Plan EOD
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'plan_eod'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_plan_report.py --mode eod

      - name: Report 5B — Daily Plan Update
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'plan_update'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_plan_report.py --mode update

      - name: Report 5C — Morning Plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'plan_morning'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_plan_report.py --mode morning

      - name: Report 6 — Daily Note Read Report
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'read_report'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python daily_read_report.py

      - name: Task — Check Read Status
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'check_read_status'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python check_read_status.py

      - name: Task — Botlookup Relay
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'botlookup_relay'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          SKIP_DELAY: ${{ github.event.inputs.skip_delay || '1' }}
        run: python botlookup_relay.py

      - name: Task — Cable Daily Report (Cron or Manual)
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'cable_report')
        env:
          COLLECTOR_BOT_TOKEN: ${{ secrets.COLLECTOR_BOT_TOKEN }}
          CABLE_APPS_SCRIPT_URL: ${{ secrets.CABLE_APPS_SCRIPT_URL }}
          CABLE_CHAT_ID: ${{ secrets.CABLE_CHAT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python cable_report.py

      - name: Task — Refuel Request Report (Cron or Manual)
        if: |
          (github.event_name == 'schedule' && (github.event.schedule == '30 10 * * *' || github.event.schedule == '30 22 * * *')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'refuel_report')
        env:
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python refuel_send.py
