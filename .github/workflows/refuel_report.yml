name: Refuel Report Master (05:39, 13:29, 21:14 MMT)

on:
  schedule:
    - cron: '9 23 * * *'   # 05:39 AM Myanmar Time (UTC+6:30) -> 23:09 UTC
    - cron: '59 6 * * *'   # 13:29 PM Myanmar Time (UTC+6:30) -> 06:59 UTC
    - cron: '44 14 * * *'  # 21:14 PM Myanmar Time (UTC+6:30) -> 14:44 UTC
  workflow_dispatch:

jobs:
  refuel-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Refuel Reports
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          REFUEL_BOT_TOKEN: ${{ secrets.REFUEL_BOT_TOKEN }}
          REFUEL_CHAT_ID: ${{ secrets.REFUEL_CHAT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python refuel_send.py
          python refuel_plan_report.py --report 1
