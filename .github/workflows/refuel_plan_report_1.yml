name: Refuel Plan Report 1 (05:32, 13:22, 21:07 MMT)

on:
  schedule:
    - cron: '2 23 * * *'   # 05:32 AM Myanmar Time (UTC+6:30) -> 23:02 UTC
    - cron: '52 6 * * *'   # 13:22 PM Myanmar Time (UTC+6:30) -> 06:52 UTC
    - cron: '37 14 * * *'  # 21:07 PM Myanmar Time (UTC+6:30) -> 14:37 UTC
  workflow_dispatch:

jobs:
  refuel-plan-report-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Refuel Plan Report 1
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          REFUEL_BOT_TOKEN: ${{ secrets.REFUEL_BOT_TOKEN }}
          REFUEL_CHAT_ID: ${{ secrets.REFUEL_CHAT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python refuel_send.py
          python refuel_plan_report.py --report 1
