name: "[LEGACY - DISABLED] Refuel Plan Report 1"

# ⚠️ SCHEDULE DISABLED — Refuel reports now run from unified daily_reports.yml
#    in public repo MON6879/tni-sitedown-relay.
on:
  workflow_dispatch:

jobs:
  refuel-plan-report-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Refuel Plan Report 1
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          REFUEL_BOT_TOKEN: ${{ secrets.REFUEL_BOT_TOKEN }}
          REFUEL_CHAT_ID: ${{ secrets.REFUEL_CHAT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python refuel_send.py
          python refuel_plan_report.py --report 1
