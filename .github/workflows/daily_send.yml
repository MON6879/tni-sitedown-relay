name: "📢 Gửi thông báo task lúc 17:30 VN"

on:
  # ⚠️ ĐÃ TẮT cron — trùng với daily_task.yml (cron_send.py), gây gửi 2 lần + delay
  # Cron cũ: 30 10 * * * UTC = 17:00 Myanmar (SAI, bị queue delay đến 01:04)
  workflow_dispatch:          # Chỉ chạy thủ công để test

jobs:
  send-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "📦 Cài dependencies"
        run: |
          pip install \
            python-telegram-bot==21.9 \
            pandas==2.2.2 \
            requests==2.31.0 \
            python-dotenv==1.0.1

      - name: "🚀 Gửi thông báo"
        env:
          SEND_BOT_TOKEN:             ${{ secrets.SEND_BOT_TOKEN }}
          TECHNICAL_DEP_BOT_TOKEN:    ${{ secrets.TECHNICAL_DEP_BOT_TOKEN }}
          APPS_SCRIPT_URL:            ${{ secrets.APPS_SCRIPT_URL }}
        run: python send_now.py
