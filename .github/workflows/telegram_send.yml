name: Telegram Daily Send

on:
  schedule:
    - cron: '18 23 * * *'  # 05:48 AM Myanmar Time (UTC+6:30) -> 23:18 UTC
    - cron: '18 9 * * *'   # 15:48 PM Myanmar Time (UTC+6:30) -> 09:18 UTC
  repository_dispatch:
    types: [run_daily_report, run_telegram_send]
  workflow_dispatch:

jobs:
  send-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all daily report scripts (backlog, task stats & note read)
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          REPORT_TASK_BOT_TOKEN: ${{ secrets.REPORT_TASK_BOT_TOKEN }}
          TECHNICAL_DEP_BOT_TOKEN: ${{ secrets.TECHNICAL_DEP_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python backlog_send.py || true
          python cron_send.py || true
          python daily_read_report.py || true
