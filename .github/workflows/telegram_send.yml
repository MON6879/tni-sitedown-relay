name: Telegram Daily Send

# ⚠️ ĐÃ TẮT cron — trùng với daily_task.yml, gây gửi 3 lần
# Cron cũ: 30 17 * * * UTC = 00:00 Myanmar (SAI)
on:
  workflow_dispatch:  # Chỉ chạy tay, không auto


jobs:
  send-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backlog_send and cron_send scripts
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          REPORT_TASK_BOT_TOKEN: ${{ secrets.REPORT_TASK_BOT_TOKEN }}
          TECHNICAL_DEP_BOT_TOKEN: ${{ secrets.TECHNICAL_DEP_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python backlog_send.py
          python cron_send.py

