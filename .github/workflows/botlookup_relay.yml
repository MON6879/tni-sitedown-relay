name: "🚨 Site Down Relay — botlookup_relay"

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Bỏ qua kiểm tra thời gian (chạy ngay)'
        required: false
        default: 'false'
        type: boolean
# schedule:
#   # 🚫 VÔ HIỆU HÓA HOÀN TOÀN: Site Down đã được gộp vào 1 Đoàn Tàu 5-Min Train tuần tự duy nhất (train_5min.yml)
#   # Tuyệt đối KHÔNG bật lại cron riêng để tránh xung đột IP và khóa Session Telegram!
#   - cron: '3,33 * * * *'

concurrency:
  group: botlookup-relay
  cancel-in-progress: false

jobs:
  relay:
    name: "🚨 Site Down Relay"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install telethon requests python-dotenv

      - name: Run Site Down Relay
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          SD_APPS_SCRIPT_URL: ${{ secrets.SD_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python botlookup_relay.py --force
          else
            python botlookup_relay.py
          fi
