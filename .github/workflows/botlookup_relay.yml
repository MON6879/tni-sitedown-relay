name: Botlookup Relay (Dedicated Fast Trigger)

on:
  schedule:
    - cron: '6/30 * * * *'   # Every 30 min at :06 and :36 MMT (:36 and :06 UTC)
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no)'
        required: false
        default: '1'
  repository_dispatch:
    types: [botlookup_relay, site_down_relay]

jobs:
  botlookup-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Task — Botlookup Relay
        env:
          TELEGRAM_API_ID:        ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:      ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:       ${{ secrets.TELEGRAM_SESSION }}
          SD_APPS_SCRIPT_URL:     ${{ secrets.SD_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL:        ${{ secrets.APPS_SCRIPT_URL }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          SD_BOTLOOKUP_CHAT_ID:   ${{ secrets.SD_BOTLOOKUP_CHAT_ID }}
          SKIP_DELAY:             '1'
          FORCE_RUN:              '1'
        run: python botlookup_relay.py --force
