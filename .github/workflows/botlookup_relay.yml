name: Botlookup Relay  # last-updated: 2026-07-10

on:
  schedule:
    - cron: '8,38 0-15,21-23 * * *'  # :08/:38 UTC = Myanmar :38/:08, active hours
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no)'
        required: false
        default: '1'

# Concurrency riêng cho botlookup — cancel-in-progress: true
# để tránh xếp hàng vô hạn khi bị delay
concurrency:
  group: botlookup-relay
  cancel-in-progress: true

jobs:
  botlookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot requests pandas python-dotenv telethon openpyxl

      - name: Task — Botlookup Relay
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          SKIP_DELAY: ${{ github.event.inputs.skip_delay || '1' }}
        run: python botlookup_relay.py
