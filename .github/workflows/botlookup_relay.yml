name: Botlookup TNI Relay

# Chỉ chạy qua workflow_dispatch (được gọi bởi GAS trigger mỗi 30p)
# KHÔNG dùng schedule cron (GitHub cron không đáng tin cậy)
on:
  workflow_dispatch:        # Gọi từ GAS relayBotlookupToTNI() hoặc tay
    inputs:
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no)'
        required: false
        default: '1'

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10    # SKIP_DELAY=1 → không có delay → tổng ~2-3p

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install telethon requests

      - name: Run Botlookup Relay
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
          APPS_SCRIPT_URL:   ${{ secrets.APPS_SCRIPT_URL }}
          SKIP_DELAY: ${{ github.event.inputs.skip_delay || '1' }}
        run: |
          python botlookup_relay.py
