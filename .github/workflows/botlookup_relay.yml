name: Botlookup Relay

on:
  schedule:
    - cron: '6,36 * * * *'   # Chạy lúc :06 và :36 MMT (6 phút sau khi NocPro update lúc :00 & :30)
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no)'
        required: false
        default: '1'

concurrency:
  group: botlookup-relay
  cancel-in-progress: true  # Hủy job cũ nếu có job mới → tránh cào dữ liệu & gửi trùng lặp

jobs:
  botlookup-and-logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'   # Cache pip → install ~10s thay vì 60s

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Task — Botlookup Relay
        env:
          TELEGRAM_API_ID:        ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:      ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:       ${{ secrets.TELEGRAM_SESSION }}
          SD_APPS_SCRIPT_URL:     ${{ secrets.SD_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL:        ${{ secrets.APPS_SCRIPT_URL }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          SD_BOTLOOKUP_CHAT_ID:   ${{ secrets.SD_BOTLOOKUP_CHAT_ID }}
          SKIP_DELAY:             '1'
        run: python botlookup_relay.py

      - name: Task — TNI Search Logger
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
          APPS_SCRIPT_URL:   ${{ secrets.APPS_SCRIPT_URL }}
          TNI_MONITOR_GROUPS: ${{ secrets.TNI_MONITOR_GROUPS }}
        run: python tni_search_logger.py


