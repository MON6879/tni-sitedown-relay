name: Botlookup Relay (Site Down)

on:
  schedule:
    # Run every 20 minutes between 03:30 and 22:30 Myanmar Time (21:00 to 16:00 UTC)
    - cron: '*/20 * * * *'
  workflow_dispatch:          # Manual trigger button

jobs:
  botlookup-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run botlookup_relay.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SD_APPS_SCRIPT_URL: ${{ secrets.SD_APPS_SCRIPT_URL }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          SKIP_DELAY: "1"
        run: |
          python botlookup_relay.py
