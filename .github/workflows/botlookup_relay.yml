name: Botlookup Relay

on:
  schedule:
    # Chạy mỗi 30 phút vào phút :08 và :38 của mỗi giờ (03:38–22:08 Myanmar time)
    - cron: '8,38 * * * *'
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip random delay (1=yes, 0=no)'
        required: false
        default: '1'

concurrency:
  group: botlookup-relay
  cancel-in-progress: false

jobs:
  botlookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot requests pandas python-dotenv telethon openpyxl

      - name: Task — Botlookup Relay
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SD_APPS_SCRIPT_URL: ${{ secrets.SD_APPS_SCRIPT_URL }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          REFUEL_APPS_SCRIPT_URL: ${{ secrets.REFUEL_APPS_SCRIPT_URL }}
          SKIP_DELAY: ${{ github.event.inputs.skip_delay || '1' }}
        run: python botlookup_relay.py
