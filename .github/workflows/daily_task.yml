name: Daily Task Reminder (17:30 Myanmar)

on:
  # ⚠️ KHÔNG dùng GitHub cron — bị delay 5-9 tiếng do queue overload
  # Trigger từ GAS relayBotlookupToTNI() lúc 17:30 Myanmar chính xác
  workflow_dispatch:

jobs:
  send-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-telegram-bot requests pandas python-dotenv

      - name: Send backlog report
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
        run: python backlog_send.py

      - name: Send task reminders
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          REPORT_TASK_BOT_TOKEN: ${{ secrets.REPORT_TASK_BOT_TOKEN }}
          TECHNICAL_DEP_BOT_TOKEN: ${{ secrets.TECHNICAL_DEP_BOT_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python cron_send.py
